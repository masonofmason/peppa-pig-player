# main에 푸시하면 public/ 폴더를 GitHub Pages로 배포한다.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # 브라우저가 예전 JS/CSS를 쓰지 않도록 ?v=dev 를 커밋 해시로 바꾼다 (GitHub Pages는 10분 캐시)
      - name: Stamp asset versions
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" public/index.html public/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
